name: Bandit Security Scan

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  bandit-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - uses: PyCQA/bandit-action@7925d472505a4ec09ef471b22fe99c26fee47443 # main 2026-10, adds 'python-version' input
      with:
        python-version: '3.11'
        targets: humble.py
        severity: high